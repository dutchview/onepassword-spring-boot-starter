name: Security CI Jobs
on: 
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  sensitive-info-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Secret Scan (Trufflehog)
    steps:

    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Trufflehog using the script 
      run: curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

    - name: Set Environement Variables
      run: |
        echo "REPO_DIR=${{ github.workspace }}" >> $GITHUB_ENV
        echo "REPO_NAME=$(echo '${{ github.repository }}' | cut -d'/' -f2)" >> $GITHUB_ENV

    - name: Run Trufflehog scan
      shell: bash
      run: |
        echo "Scanning repo using Trufflehog..."
        trufflehog git file://${{ env.REPO_DIR }} --json > ${{ env.REPO_NAME }}-Trufflehog-report.json

    - name: Upload Trufflehog report
      uses: actions/upload-artifact@v4
      with:
        name: sensitive-info-scan
        path: ${{ env.REPO_NAME }}-Trufflehog-report.json
    
  sast-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: SAST (DevSkim and Semgrep)
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Set up .NET and DevSkim
      run: |
        wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
        chmod +x ./dotnet-install.sh
        ./dotnet-install.sh
        dotnet tool install --global Microsoft.CST.DevSkim.CLI
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

    - name: Set Environment Variable
      run: |
        echo "REPO_DIR=${{ github.workspace }}" >> $GITHUB_ENV
        echo "REPO_NAME=$(echo '${{ github.repository }}' | cut -d'/' -f2)" >> $GITHUB_ENV

    - name: Run DevSkim scan
      run: |
        devskim analyze -I . -f sarif --output-format json > ${{ env.REPO_NAME }}-DevSkim-report.json
      continue-on-error: true

    - name: Upload DevSkim scan results
      uses: actions/upload-artifact@v4
      with:
        name: devskim-report
        path: |
          ${{ env.REPO_NAME }}-DevSkim-report.json

    - name: Create Python virtual env
      run: python -m venv .venv

    - name: Switch to Virtual env for installing the scanner
      run: source .venv/bin/activate  

    - name: Install Semgrep
      run: pip install semgrep        

    - name: Run Semgrep scan
      run: |
        semgrep scan --exclude=dotnet-install.sh --exclude=security-ci-jobs.yaml --json --json-output=${{ env.REPO_NAME }}-Semgrep-report.json
      continue-on-error: true

    - name: Upload Semgrep scan result
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: ${{ env.REPO_NAME }}-Semgrep-report.json

  sbom-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: SBOM (Syft)
    
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    
    - name: Install Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
        syft version

    - name: Set Environment Variables
      run: |
        echo "REPO_DIR=${{ github.workspace }}" >> $GITHUB_ENV
        echo "REPO_NAME=$(echo '${{ github.repository }}' | cut -d'/' -f2)" >> $GITHUB_ENV

    - name: Run SBOM scan on the local repo
      run: |
        echo "Running Syft SBOM scan on: ${{ env.REPO_DIR }}"
        syft scan ${{ env.REPO_DIR }} -o json > "${{ env.REPO_NAME }}-Syft-json-sbom-report.json"
        syft scan ${{ env.REPO_DIR }} -o spdx-json > "${{ env.REPO_NAME }}-Syft-spdx-sbom-report.json"
        syft scan ${{ env.REPO_DIR }} -o cyclonedx-json > "${{ env.REPO_NAME }}-Syft-cyclone-dx-sbom-report.json"

    - name: Upload SBOM JSON Report
      uses: actions/upload-artifact@v4
      with:
        name: syft-sbom-json-report
        path: |
          ${{ env.REPO_NAME }}-Syft-json-sbom-report.json

    - name: Upload SBOM SPDX Report
      uses: actions/upload-artifact@v4
      with:
        name: syft-sbom-spdx-report
        path: |
          ${{ env.REPO_NAME }}-Syft-spdx-sbom-report.json

    - name: Upload SBOM Cyclone DX Report
      uses: actions/upload-artifact@v4
      with:
        name: syft-sbom-cyclone-dx-report
        path: |
          ${{ env.REPO_NAME }}-Syft-cyclone-dx-sbom-report.json

  sca-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sbom-scan 
    name: SCA (Grype & Trivy)
    
    steps:
    
    - name: Checkout the code
      uses: actions/checkout@v4
      
    - name: Install Grype
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
        grype version
        
    - name: Set Environment Variables
      run: |
        echo "REPO_DIR=${{ github.workspace }}" >> $GITHUB_ENV
        echo "REPO_NAME=$(echo '${{ github.repository }}' | cut -d'/' -f2)" >> $GITHUB_ENV

    - name: Download SBOM Artifact from Syft
      uses: actions/download-artifact@v4
      with:
        name: syft-sbom-json-report

    - name: Run Grype SCA scan
      run: |
        pwd
        ls -ltr
        echo "Scanning SBOM with Grype..."
        cat ${{ env.REPO_DIR }}/${{ env.REPO_NAME }}-Syft-json-sbom-report.json | grype -o json > ${{ env.REPO_NAME }}-Grype-sca-report.json

    - name: Upload Grype Scan Report
      uses: actions/upload-artifact@v4
      with:
        name: Grype-Report
        path: |
          ${{ env.REPO_NAME }}-Grype-sca-report.json

    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@0.35.0
      with:
        scan-type: 'fs'
        output: ${{ env.REPO_NAME }}-Trivy-report.json
        format: json
        scan-ref: '.'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy Vulnerability Scan Report
      uses: actions/upload-artifact@v4
      with:
        name: Trivy-Report
        path: ${{ env.REPO_NAME }}-Trivy-report.json

  license-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sbom-scan
    name: 3rd-Party License Report

    steps:
    - name: Checkout the code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set Environment Variables
      run: |
        echo "REPO_NAME=$(echo '${{ github.repository }}' | cut -d'/' -f2)" >> $GITHUB_ENV

    - name: Download SPDX SBOM Artifact
      uses: actions/download-artifact@v4
      with:
        name: syft-sbom-spdx-report
        path: sbom-artifacts

    - name: Download CycloneDX SBOM Artifact
      uses: actions/download-artifact@v4
      with:
        name: syft-sbom-cyclone-dx-repor
        path: sbom-artifacts

    - name: Generate License Report
      run: |
        python .github/scripts/generate-license-report.py \
          --spdx "sbom-artifacts/${{ env.REPO_NAME }}-Syft-spdx-sbom-report.json" \
          --cyclonedx "sbom-artifacts/${{ env.REPO_NAME }}-Syft-cyclone-dx-sbom-report.json" \
          --repo-name "${{ env.REPO_NAME }}" \
          --output "${{ env.REPO_NAME }}-3rd-party-license-report.html"

    - name: Upload License Report
      uses: actions/upload-artifact@v4
      with:
        name: 3rd-party-license-report
        path: ${{ env.REPO_NAME }}-3rd-party-license-report.html

